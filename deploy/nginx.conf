# ==============================================================================
# Nginx Configuration for Saramax (AKFA) Monorepo (Django + Vue 3 SPA)
# Faylni serverda /etc/nginx/sites-available/akfa manziliga joylashtiring
# ==============================================================================

server {
    listen 80;
    server_name your_domain.uz www.your_domain.uz; # O'z domeningiz yoki Server IP

    # Maksimal yuklanadigan fayl hajmi (rasmlar uchun)
    client_max_body_size 50M;

    # 1. Frontend: Vue 3 Single Page Application (SPA)
    location / {
        root /var/www/akfa/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend: Django REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # 3. Backend: Django Built-in Admin (Baza uchun)
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # 3. Media fayllar (Admin yuklagan rasmlar, bannerlar)
    location /media/ {
        alias /var/www/akfa/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Django Static fayllar (Admin panel CSS/JS)
    location /static/ {
        alias /var/www/akfa/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip siqish (Sayt tez yuklanishi uchun)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
